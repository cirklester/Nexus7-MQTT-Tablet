name: Android CI Build for Nexus 7

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1. Розпакування архіву
      - name: Unzip Source Files
        run: |
          if [ -f "MqttProject.zip" ]; then
            unzip -o MqttProject.zip
          elif [ -f "app-debug.zip" ]; then
            unzip -o app-debug.zip
          fi

      # 2. Хмарна генерація файлів за допомогою безпечного екранування символів
      - name: Force Generate Valid Gradle Infrastructure
        run: |
          mkdir -p app/src/main/java/com/example/myapplication
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/res/values

          # Копіюємо ваші Java-файли
          find . -name "MainActivity.java" -exec cp {} app/src/main/java/com/example/myapplication/MainActivity.java \;
          find . -name "SettingsActivity.java" -exec cp {} app/src/main/java/com/example/myapplication/SettingsActivity.java \;
          find . -name "activity_main.xml" -exec cp {} app/src/main/res/layout/activity_main.xml \;
          find . -name "row_sensor.xml" -exec cp {} app/src/main/res/layout/row_sensor.xml \;
          find . -name "preferences.xml" -exec cp {} app/src/main/res/xml/preferences.xml \;

          # Створюємо базовий settings.gradle
          echo "include ':app'" > settings.gradle

          # Створюємо головний build.gradle
          printf "buildscript {\n    repositories { google(); mavenCentral() }\n    dependencies { classpath 'com.android.tools.build:gradle:8.2.2' }\n}\nallprojects {\n    repositories {\n        google()\n        mavenCentral()\n        maven { url 'https://eclipse.org' }\n    }\n}\n" > build.gradle

          # Створюємо build.gradle для додатка (з підтримкою Android 4.3 та Java 8)
          printf "apply plugin: 'com.android.application'\nandroid {\n    compileSdkVersion 34\n    namespace \"com.example.myapplication\"\n    defaultConfig {\n        applicationId \"com.example.myapplication\"\n        minSdkVersion 18\n        targetSdkVersion 18\n        versionCode 1\n        versionName \"1.0\"\n    }\n    compileOptions {\n        sourceCompatibility JavaVersion.VERSION_1_8\n        targetCompatibility JavaVersion.VERSION_1_8\n    }\n}\ndependencies {\n    implementation 'org.eclipse.paho:org.eclipse.paho.client.mqttv3:1.1.1'\n}\n" > app/build.gradle

          # Створюємо 100%% чистий AndroidManifest.xml за допомогою шістнадцяткового кодування двокрапки (\x3a)
          printf "<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<manifest xmlns\x3aandroid=\"http://android.com\">\n    <uses-permission android\x3aname=\"android.permission.INTERNET\"/>\n    <uses-permission android\x3aname=\"android.permission.ACCESS_NETWORK_STATE\"/>\n    <application\n        android\x3aallowBackup=\"true\"\n        android\x3alabel=\"MQTT Weather Tablet\"\n        android\x3atheme=\"@android\x3astyle/Theme.Holo.NoActionBar.Fullscreen\">\n        <activity\n            android\x3aname=\"com.example.myapplication.MainActivity\"\n            android\x3ascreenOrientation=\"landscape\"\n            android\x3aexported=\"true\">\n            <intent-filter>\n                <action android\x3aname=\"android.intent.action.MAIN\" />\n                <category android\x3aname=\"android.intent.category.LAUNCHER\" />\n            </intent-filter>\n        </activity>\n        <activity\n            android\x3aname=\"com.example.myapplication.SettingsActivity\"\n            android\x3alabel=\"Налаштування\"\n            android\x3aexported=\"false\" />\n    </application>\n</manifest>\n" > app/src/main/AndroidManifest.xml

          # Створюємо стилі
          printf "<resources>\n    <style name=\"Theme.MyApplication\" parent=\"@android\x3astyle/Theme.Holo.NoActionBar.Fullscreen\" />\n</resources>\n" > app/src/main/res/values/styles.xml

      # 3. Встановлення Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      # 4. Підключення стабільного Gradle 8.2
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      # 5. Компіляція
      - name: Build with Gradle
        run: gradle :app:assembleDebug

      # 6. Збереження готового APK файлу у розділ завантажень (Artifacts)
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
