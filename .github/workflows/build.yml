name: Android CI Build for Nexus 7

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1. Розпакування вашого локального архіву
      - name: Unzip Source Files
        run: |
          if [ -f "MqttProject.zip" ]; then
            unzip -o MqttProject.zip
          elif [ -f "app-debug.zip" ]; then
            unzip -o app-debug.zip
          fi

      # 2. РАДИКАЛЬНЕ ОЧИЩЕННЯ: Повністю стираємо всі маніфести та конфіги, які розпакувалися з вашого ПК
      - name: Purge Old Infrastructure
        run: |
          find . -name "AndroidManifest.xml" -delete || true
          find . -name "*.gradle" -delete || true
          find . -name "*.gradle.kts" -delete || true
          find . -name "styles.xml" -delete || true

      # 3. Хмарне створення чистого дерева проекту з нуля
      - name: Force Generate Valid Gradle Infrastructure
        run: |
          mkdir -p app/src/main/java/com/example/myapplication
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/res/values

          # Переміщуємо ТІЛЬКИ чисті Java-класи та XML-інтерфейси екранів
          find . -name "MainActivity.java" -exec cp {} app/src/main/java/com/example/myapplication/MainActivity.java \;
          find . -name "SettingsActivity.java" -exec cp {} app/src/main/java/com/example/myapplication/SettingsActivity.java \;
          find . -name "activity_main.xml" -exec cp {} app/src/main/res/layout/activity_main.xml \;
          find . -name "row_sensor.xml" -exec cp {} app/src/main/res/layout/row_sensor.xml \;
          find . -name "preferences.xml" -exec cp {} app/src/main/res/xml/preferences.xml \;

          # Створюємо базовий конфіг settings.gradle
          echo "include ':app'" > settings.gradle

          # Створюємо головний build.gradle
          cat << 'EOF' > build.gradle
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.2.2' }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
                  maven { url 'https://eclipse.org' }
              }
          }
          EOF

          # Створюємо build.gradle додатка з підстановками (Manifest Placeholders)
          cat << 'EOF' > app/build.gradle
          apply plugin: 'com.android.application'
          android {
              compileSdkVersion 34
              namespace "com.example.myapplication"
              defaultConfig {
                  applicationId "com.example.myapplication"
                  minSdkVersion 18
                  targetSdkVersion 18
                  versionCode 1
                  versionName "1.0"
                  manifestPlaceholders = [
                      mainActivityName: "com.example.myapplication.MainActivity",
                      settingsActivityName: "com.example.myapplication.SettingsActivity"
                  ]
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
          }
          dependencies {
              implementation 'org.eclipse.paho:org.eclipse.paho.client.mqttv3:1.1.1'
          }
          EOF

          # Створюємо 100% новий AndroidManifest.xml без прямого прописування шляхів, що викликали баг
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://android.com">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
              <application
                  android:allowBackup="true"
                  android:label="MQTT Weather Tablet"
                  android:theme="@android:style/Theme.Holo.NoActionBar.Fullscreen">
                  <activity
                      android:name="${mainActivityName}"
                      android:screenOrientation="landscape"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <activity
                      android:name="${settingsActivityName}"
                      android:label="Налаштування"
                      android:exported="false" />
              </application>
          </manifest>
          EOF

          # Створюємо чистий файл стилів
          cat << 'EOF' > app/src/main/res/values/styles.xml
          <resources>
              <style name="Theme.MyApplication" parent="@android:style/Theme.Holo.NoActionBar.Fullscreen" />
          </resources>
          EOF

      # 4. Встановлення Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      # 5. Підключення стабільного інструменту Gradle 8.2
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      # 6. Фінальний запуск компіляції проекту
      - name: Build with Gradle
        run: gradle :app:assembleDebug

      # 7. Збереження готового сумісного APK файлу у розділ Artifacts
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
