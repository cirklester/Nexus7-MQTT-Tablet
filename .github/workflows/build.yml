name: Android CI Build for Nexus 7

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1. Розпакування вашого архіву коду
      - name: Unzip Source Files
        run: |
          if [ -f "MqttProject.zip" ]; then
            unzip -o MqttProject.zip
          elif [ -f "app-debug.zip" ]; then
            unzip -o app-debug.zip
          fi

      # 2. Примусове хмарне створення правильної структури проекту з нуля
      - name: Force Generate Valid Gradle Infrastructure
        run: |
          # Створюємо базову структуру папок, якщо якась відсутня
          mkdir -p app/src/main/java/com/example/myapplication
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/res/values

          # Переміщуємо ваші Java-файли у правильне місце, де б вони не лежали після розпакування
          find . -name "MainActivity.java" -exec cp {} app/src/main/java/com/example/myapplication/MainActivity.java \;
          find . -name "SettingsActivity.java" -exec cp {} app/src/main/java/com/example/myapplication/SettingsActivity.java \;
          find . -name "activity_main.xml" -exec cp {} app/src/main/res/layout/activity_main.xml \;
          find . -name "row_sensor.xml" -exec cp {} app/src/main/res/layout/row_sensor.xml \;
          find . -name "preferences.xml" -exec cp {} app/src/main/res/xml/preferences.xml \;

          # Самі створюємо 100% валідний файл settings.gradle
          echo "include ':app'" > settings.gradle

          # Самі створюємо безвідмовний build.gradle для всього проекту
          cat << 'EOF' > build.gradle
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.2.2' }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
                  maven { url 'https://eclipse.org' }
              }
          }
          EOF

          # Самі створюємо build.gradle конкретно для додатка (з підтримкою Android 4.3 та Java 8)
          cat << 'EOF' > app/build.gradle
          apply plugin: 'com.android.application'
          android {
              compileSdkVersion 34
              namespace "com.example.myapplication"
              defaultConfig {
                  applicationId "com.example.myapplication"
                  minSdkVersion 18
                  targetSdkVersion 18
                  versionCode 1
                  versionName "1.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
          }
          dependencies {
              implementation 'org.eclipse.paho:org.eclipse.paho.client.mqttv3:1.1.1'
          }
          EOF

          # Самі створюємо 100% чистий та робочий AndroidManifest.xml
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://android.com">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
              <application
                  android:allowBackup="true"
                  android:label="MQTT Weather Tablet"
                  android:theme="@android:style/Theme.Holo.NoActionBar.Fullscreen">
                  <activity
                      android:name="com.example.myapplication.MainActivity"
                      android:screenOrientation="landscape"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <activity
                      android:name="com.example.myapplication.SettingsActivity"
                      android:label="Налаштування"
                      android:exported="false" />
              </application>
          </manifest>
          EOF

          # Створюємо базові стилі, щоб компілятор не ламався
          cat << 'EOF' > app/src/main/res/values/styles.xml
          <resources>
              <style name="Theme.MyApplication" parent="@android:style/Theme.Holo.NoActionBar.Fullscreen" />
          </resources>
          EOF

      # 3. Встановлення Java 17 для запуску сучасного інструменту збірки
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      # 4. Автоматичне підключення перевіреного та чистого компілятора Gradle 8.2
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      # 5. Фінальний запуск компіляції
      - name: Build with Gradle
        run: gradle :app:assembleDebug

      # 6. Збереження та видача вам готового APK файлу
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
