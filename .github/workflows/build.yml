name: Android CI Build for Nexus 7

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1. Розпакування та примусовий глибокий пошук файлів проекту
      - name: Advanced Unzip and Project Extraction
        run: |
          if [ -f "MqttProject.zip" ]; then
            unzip -o MqttProject.zip
          elif [ -f "app-debug.zip" ]; then
            unzip -o app-debug.zip
          fi

          echo "=== Глибокий пошук структури проекту ==="
          # Шукаємо, в якій саме папці лежить settings.gradle.kts
          SETTINGS_PATH=$(find . -name "settings.gradle.kts" -not -path "*/.github/*" | head -n 1)
          
          if [ -n "$SETTINGS_PATH" ]; then
            PROJECT_DIR=$(dirname "$SETTINGS_PATH")
            echo "Проект знайдено в папці: $PROJECT_DIR"
            
            # Якщо проект лежить не в корені, переміщуємо його вміст сюди
            if [ "$PROJECT_DIR" != "." ]; then
              cp -r $PROJECT_DIR/* . || true
              cp -r $PROJECT_DIR/.* . || true
            fi
          else
            echo "🛑 Помилка: Не знайдено файл settings.gradle.kts у жодній папці!"
            exit 1
          fi

      # 2. Встановлення правильної версії Java
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. Автоматичний підбір читого інструменту Gradle 8.8
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      # 4. Компiляція безвідмовного Java 8 байткоду для Nexus 7
      - name: Build with Gradle
        run: gradle assembleDebug

      # 5. Публікація готового робочого APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
