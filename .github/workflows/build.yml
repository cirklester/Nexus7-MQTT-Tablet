name: Android CI Build for Nexus 7

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1. Розпакування та інтелектуальне вирівнювання структури папок
      - name: Unzip and Align Project Structure
        run: |
          if [ -f "MqttProject.zip" ]; then
            unzip -o MqttProject.zip
          elif [ -f "app-debug.zip" ]; then
            unzip -o app-debug.zip
          fi
          
          # Якщо файли розпакувалися всередину підпапки, переміщуємо їх у корінь
          if [ -d "MqttProject" ]; then
            echo "Moving files from MqttProject subfolder to root..."
            mv MqttProject/* . || true
            mv MqttProject/.* . || true
          elif [ -d "MyApplication" ]; then
            echo "Moving files from MyApplication subfolder to root..."
            mv MyApplication/* . || true
            mv MyApplication/.* . || true
          fi

      # 2. Встановлення правильної версії JDK (Java 17)
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. Автоматичне завантаження чистого та сумісного Gradle 8.8
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      # 4. Гарантований запуск компіляції додатка
      - name: Build with Gradle
        run: gradle assembleDebug

      # 5. Збереження та видача вам готового APK файлу для Nexus 7
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
