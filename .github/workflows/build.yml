name: Android CI Build for Nexus 7

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1. Розпакування вашого архіву
      - name: Unzip Source Files
        run: |
          if [ -f "MqttProject.zip" ]; then
            unzip -o MqttProject.zip
          elif [ -f "app-debug.zip" ]; then
            unzip -o app-debug.zip
          fi

      # 2. Потокова автоматична генерація коду
      - name: Force Generate Valid Gradle Infrastructure
        run: |
          mkdir -p app/src/main/java/com/example/myapplication
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/res/values

          # Переміщення ваших вихідних Java-файлів та розміток
          find . -name "MainActivity.java" -exec cp {} app/src/main/java/com/example/myapplication/MainActivity.java \;
          find . -name "SettingsActivity.java" -exec cp {} app/src/main/java/com/example/myapplication/SettingsActivity.java \;
          find . -name "activity_main.xml" -exec cp {} app/src/main/res/layout/activity_main.xml \;
          find . -name "row_sensor.xml" -exec cp {} app/src/main/res/layout/row_sensor.xml \;
          find . -name "preferences.xml" -exec cp {} app/src/main/res/xml/preferences.xml \;

          # Створення файлів налаштувань Gradle
          echo "include ':app'" > settings.gradle

          cat << 'EOF' > build.gradle
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.2.2' }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
                  maven { url 'https://eclipse.org' }
              }
          }
          EOF

          cat << 'EOF' > app/build.gradle
          apply plugin: 'com.android.application'
          android {
              compileSdkVersion 34
              namespace "com.example.myapplication"
              defaultConfig {
                  applicationId "com.example.myapplication"
                  minSdkVersion 18
                  targetSdkVersion 18
                  versionCode 1
                  versionName "1.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
          }
          dependencies {
              implementation 'org.eclipse.paho:org.eclipse.paho.client.mqttv3:1.1.1'
          }
          EOF

          # Створюємо маніфест за допомогою тимчасових маркерів MATCH_COLON
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlnsMATCH_COLONandroid="http://android.com">
              <uses-permission androidMATCH_COLONname="android.permission.INTERNET"/>
              <uses-permission androidMATCH_COLONname="android.permission.ACCESS_NETWORK_STATE"/>
              <application
                  androidMATCH_COLONallowBackup="true"
                  androidMATCH_COLONlabel="MQTT Weather Tablet"
                  androidMATCH_COLONtheme="@android:style/Theme.Holo.NoActionBar.Fullscreen">
                  <activity
                      androidMATCH_COLONname="com.example.myapplication.MainActivity"
                      androidMATCH_COLONscreenOrientation="landscape"
                      androidMATCH_COLONexported="true">
                      <intent-filter>
                          <action androidMATCH_COLONname="android.intent.action.MAIN" />
                          <category androidMATCH_COLONname="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <activity
                      androidMATCH_COLONname="com.example.myapplication.SettingsActivity"
                      androidMATCH_COLONlabel="Налаштування"
                      androidMATCH_COLONexported="false" />
              </application>
          </manifest>
          EOF

          # Використовуємо потоковий утилітарний Linux-редактор sed, який виправляє маркери на двокрапку в обхід багів буфера
          sed -i 's/MATCH_COLON/:/g' app/src/main/AndroidManifest.xml

          cat << 'EOF' > app/src/main/res/values/styles.xml
          <resources>
              <style name="Theme.MyApplication" parent="@android:style/Theme.Holo.NoActionBar.Fullscreen" />
          </resources>
          EOF

      # 3. Встановлення Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      # 4. Підключення стабільного Gradle 8.2
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      # 5. Компіляція проекту
      - name: Build with Gradle
        run: gradle :app:assembleDebug

      # 6. Збереження готового APK файлу у розділ Artifacts
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
