name: Android CI Build for Nexus 7

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Примусово розпаковуємо ваш завантажений архів прямо в хмарі
      - name: Unzip project files
        run: |
          if [ -f "MqttProject.zip" ]; then
            unzip -o MqttProject.zip
          elif [ -f "app-debug.zip" ]; then
            unzip -o app-debug.zip
          else
            echo "ZIP file not found, continuing with existing files..."
          fi

      # Встановлюємо актуальну версію JDK за новими правилами GitHub 2026 року
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      # Самостійне завантаження чистого Gradle в обхід локальних файлів комп'ютера
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      # Запуск компіляції додатка
      - name: Build with Gradle
        run: gradle assembleDebug

      # Збереження готового APK файлу у розділ завантажень
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
